name: freedom-data
# Twice a day: restore the data directory from the newest artifact, pull new Hyperliquid
# candles/funding/context and a consensus snapshot, then extend the full-universe earnings
# history and dataset as far as the day's free FMP quota allows, and re-upload everything.
#
# Hyperliquid serves only the most recent 5000 candles per interval (1m ≈ 83 h), so the archive
# must run continuously. FMP's free plan allows ~250 requests a day; `freedom events` and
# `freedom dataset` treat an exhausted budget as a checkpoint (exit 2, rows marked pending) and
# resume from the on-disk cache on the next run, so the first full build completes over a few
# days without anyone watching it. The 00:17 UTC run lands just after the quota resets.
#
# Setup: add FMP_API_KEY as a repository secret. Nothing vendor-derived is committed to the
# repository; the data lives only in the `freedom-data` artifact. NOTE: on a public repository
# any logged-in GitHub user can download workflow artifacts; make the repository private if
# that matters. Older artifacts are deleted after each upload so storage stays at ~2 copies.
# The freedom-cards job (cards.yml) reads this artifact and adds its live rows to the
# `freedom-live` artifact, which this job restores on top so the rows end up in freedom-data.
on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
permissions:
  actions: write  # delete superseded artifacts
  contents: read
concurrency:
  group: freedom-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}  # optional: report-date cross-check for foreign issuers
      FREEDOM_SEC_USER_AGENT: "freedom-harness ${{ github.repository_owner }}@users.noreply.github.com"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11
      - run: uv venv && uv pip install -e .
      - name: Restore data from the newest artifact
        env:
          GH_TOKEN: ${{ github.token }}
        # actions/download-artifact only sees the current run; gh fetches the newest artifact
        # of that name from any earlier run, which is how the data accumulates.
        run: gh run download -n freedom-data -D data -R "${{ github.repository }}" || echo "no previous data (first run)"
      - name: Restore live rows and cards from the newest freedom-live artifact
        env:
          GH_TOKEN: ${{ github.token }}
        # on top: the freedom-cards job's data/live_predictions.parquet (and reports/cards) travel
        # into the data artifact, where `freedom evaluate --live` and the next restore find them
        run: gh run download -n freedom-live -D . -R "${{ github.repository }}" || echo "no live artifact yet"
      - name: Universe
        run: uv run freedom universe
      - name: Archive candles, funding, context, consensus
        # --strict: exit 4 when any item errored or 1-minute bars were lost past the server
        # horizon; the step is marked failed (GitHub notifies) but the build carries on.
        continue-on-error: true
        run: uv run freedom archive --strict
      - name: Earnings events (full universe; exit 2 = daily quota reached, resumes tomorrow)
        continue-on-error: true
        run: uv run freedom events --since 2024-01-01
      - name: Targets and features (exit 2 = daily quota reached, resumes tomorrow)
        continue-on-error: true
        run: uv run freedom dataset --decision-times pre_10m,pre_5m,post_15m,post_30m
      - name: Status
        run: uv run freedom status
      - name: Evaluate (walk-forward on whatever is built so far; the report is the deliverable)
        continue-on-error: true
        run: uv run freedom evaluate --decision-times pre_10m,post_30m
      # The card models the freedom-cards job loads (data/models/<decision>/lightgbm); each step
      # is allowed to fail while the dataset is still too small to fit one.
      - name: Train the pre_10m card model
        continue-on-error: true
        run: uv run freedom train --decision-time pre_10m --model lightgbm
      - name: Train the post_15m card model
        continue-on-error: true
        run: uv run freedom train --decision-time post_15m --model lightgbm
      - name: Train the post_30m card model
        continue-on-error: true
        run: uv run freedom train --decision-time post_30m --model lightgbm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freedom-data
          path: data
          retention-days: 7
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freedom-reports
          path: reports
          retention-days: 30
          if-no-files-found: ignore
      - name: Delete superseded data artifacts (keep the newest 2)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?name=freedom-data&per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[2:] | .[].id' \
            | while read -r id; do gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && echo "deleted $id"; done
