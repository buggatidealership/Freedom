# Curated classification of Hyperliquid HIP-3 markets. Reviewed by a human; the automatic
# SEC-ticker match is only a hint. Keys are market names (dex:SYMBOL).
#
# kind: equity_us | equity_fpi | equity_intl | etf | index | commodity | fx | crypto | preipo | rate | other
# underlying: US ticker used for FMP / SEC lookups (defaults to SYMBOL for equities)
# verify: true  -> classification uncertain; the universe command prints these for review
# exclude_reason: free text; any kind other than equity_us / equity_fpi is excluded from events
#
# Entries marked verify were classified from the SEC ticker file and public knowledge as of
# 2026-09-02 and may be wrong (e.g. a pre-IPO name may have listed since). Fix here, not in code.

defaults:
  dex_priority: [xyz, para, io, mkts, hyna]   # primary market tie-break after volume

