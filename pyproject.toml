[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "freedom"
version = "0.1.0"
description = "Post-earnings price-action harness for equities tradable as perpetuals on Hyperliquid"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  "tenacity>=8.2",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "optuna>=3.6",
  "exchange-calendars>=4.5",
  "pyyaml>=6",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "respx>=0.21", "types-PyYAML"]

[project.scripts]
freedom = "freedom.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/freedom"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
